server:
  port: 8084


spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hotelio}
    username: ${SPRING_DATASOURCE_USERNAME:hotelio}
    password: ${SPRING_DATASOURCE_PASSWORD:hotelio}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.format_sql: false

booking:
  service:
    external-host: booking-service
    external-port: 8085
