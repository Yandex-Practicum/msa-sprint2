version: "3.8"

services:
  monolith:
    build:
      context: ../monolith
      dockerfile: Dockerfile
    container_name: hotelio-monolith
    ports:
      - "8084:8080"
    networks:
      - hotelio-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monolith-db:5432/hotelio
      SPRING_DATASOURCE_USERNAME: hotelio
      SPRING_DATASOURCE_PASSWORD: hotelio
      BOOKING_SERVICE_EXTERNAL_HOST: booking-service
      BOOKING_SERVICE_EXTERNAL_PORT: 9090

  monolith-db:
    image: postgres:15
    container_name: hotelio-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    ports:
      - "5443:5432"
    volumes:
      - monolith-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - hotelio-net
      
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotelio-net

  booking-db:
    image: postgres:15-alpine
    container_name: booking-db
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
    ports:
      - "5444:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelio -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  booking-service:
    build:
      context: ./booking-service
    container_name: booking-service
    ports:
      - "9090:9090"
    environment:
      - DB_CONNECTION_STRING=Host=booking-db;Port=5432;Username=hotelio;Password=hotelio;Database=booking_db;Pooling=true;
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      booking-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - hotelio-net

  booking-history-service:
    build:
      context: ./booking-history-service
    container_name: booking-history-service
    environment:
      - DB_CONNECTION_STRING=Host=booking-history-db;Port=5432;Username=hotelio;Password=hotelio;Database=booking_history_db;Pooling=true;
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      booking-history-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - hotelio-net
      
  booking-history-db:
    image: postgres:15-alpine
    container_name: booking-history-db
    environment:
      POSTGRES_DB: booking_history_db
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
    ports:
      - "5445:5432"
    volumes:
      - booking-history-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelio -d booking_history_db"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  monolith-db-data:
  booking-db-data:
  booking-history-db-data:
  
networks:
  hotelio-net:
    external: true
