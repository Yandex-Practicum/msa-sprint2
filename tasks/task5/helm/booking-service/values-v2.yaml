replicaCount: 1
version: v2

image:
  name: booking-service
  tag: latest
  pullPolicy: Never

service:
  create: false  # <-- ДОБАВЛЕНО: НЕ создаем сервис (он уже есть от v1)
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

env:
  - name: ENABLE_FEATURE_X
    value: "true"