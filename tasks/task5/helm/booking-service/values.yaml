image:
  name: booking-service
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /ping
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ping
    port: 8080
  initialDelaySeconds: 2
  periodSeconds: 5

versions:
  - name: v1
    tag: v1
    replicaCount: 2
    env:
      - name: APP_VERSION
        value: "v1"
      - name: ENABLE_FEATURE_X
        value: "false"
  - name: v2
    tag: v2
    replicaCount: 1
    env:
      - name: APP_VERSION
        value: "v2"
      - name: ENABLE_FEATURE_X
        value: "false"