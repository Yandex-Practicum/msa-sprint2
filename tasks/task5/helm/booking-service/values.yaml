image:
  name: booking-service
  tag: latest
  # "Never" for images loaded locally via `minikube image load` (see README).
  # Override to IfNotPresent/Always in staging/prod when pulling from a registry.
  pullPolicy: Never

# Two versions of the SAME image, fronted by one Service, distinguished by the
# `version` pod label (which Istio DestinationRule subsets select on) and the
# ENABLE_FEATURE_X env var. Istio VirtualService/EnvoyFilter decide which one
# handles a given request (90/10 canary split, or 100% v2 on X-Feature-Enabled).
versions:
  - name: v1
    replicaCount: 2
    enableFeatureX: "false"
  - name: v2
    replicaCount: 1
    enableFeatureX: "true"

service:
  type: ClusterIP
  port: 80
  targetPort: 9090
  # Plain HTTP /ping, separate from the gRPC API/probes — this is what Istio
  # routing (canary/fallback/feature-flag) is exercised and verified through.
  httpPort: 8080

istio:
  enabled: true
  canary:
    v1Weight: 90
    v2Weight: 10
  retries:
    attempts: 3
    perTryTimeout: 2s
    retryOn: "5xx,reset,connect-failure,refused-stream"
  outlierDetection:
    consecutive5xxErrors: 3
    consecutiveGatewayErrors: 3
    interval: 5s
    baseEjectionTime: 30s
    maxEjectionPercent: 100

postgres:
  enabled: true
  user: booking
  password: booking
  database: booking

kafka:
  enabled: true


env:
  - name: PGHOST
    value: booking-postgres
  - name: PGPORT
    value: "5432"
  - name: PGUSER
    value: booking
  - name: PGPASSWORD
    value: booking
  - name: PGDATABASE
    value: booking
  - name: KAFKA_BROKERS
    value: booking-kafka:9092
  - name: KAFKA_TOPIC
    value: booking-events
  - name: GRPC_PORT
    value: "9090"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# booking-service exposes the standard gRPC Health Checking Protocol:
#  - "" (empty service name)  -> overall liveness (server is bound and accepting connections)
#  - "readiness"              -> ready to serve traffic (DB + Kafka connected)
livenessProbe:
  grpc:
    port: 9090
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  grpc:
    port: 9090
    service: readiness
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
