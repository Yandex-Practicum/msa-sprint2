replicaCount: 1
version: v1

image:
  name: booking-service
  tag: latest
  pullPolicy: Never

service:
  create: true  # <-- ДОБАВЛЕНО: создаем сервис
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

env:
  - name: ENABLE_FEATURE_X
    value: "false"