apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}
spec:
  hosts:
  - {{ .Release.Name }}
  http:
  # Маршрут 1: обычные запросы (Canary 90/10)
  - match:
    - withoutHeaders:
        x-feature-enabled: {}
    route:
    - destination:
        host: {{ .Release.Name }}
        subset: v1
      weight: 90
    - destination:
        host: {{ .Release.Name }}
        subset: v2
      weight: 10
    retries:
      attempts: 3
      perTryTimeout: 2s
    timeout: 10s

  # Маршрут 2: с фича-флагом → v2
  - match:
    - headers:
        x-feature-enabled:
          exact: "true"
    route:
    - destination:
        host: {{ .Release.Name }}
        subset: v2
    retries:
      attempts: 3
      perTryTimeout: 2s
    timeout: 10s

  # Маршрут 3: fallback если v1 ошибка → на v2
  - route:
    - destination:
        host: {{ .Release.Name }}
        subset: v2
    retries:
      attempts: 2
      perTryTimeout: 1s
    timeout: 5s