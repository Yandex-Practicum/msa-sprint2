{{- $app := .Values.appName | default .Release.Name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ $app }}
    {{- with .Values.version }}
    version: {{ . }}
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $app }}
      {{- with .Values.version }}
      version: {{ . }}
      {{- end }}
  template:
    metadata:
      labels:
        app: {{ $app }}
        {{- with .Values.version }}
        # Метка version — по ней Istio делит трафик между подмножествами v1 и v2
        version: {{ . }}
        {{- end }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: ENABLE_FEATURE_X
              value: {{ .Values.featureFlags.enableFeatureX | quote }}
            {{- with .Values.version }}
            - name: APP_VERSION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
