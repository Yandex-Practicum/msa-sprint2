{{- range $v := .Values.versions }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $v.name }}
  labels:
    app: {{ $.Release.Name }}
    version: {{ $v.name }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}
      version: {{ $v.name }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}
        version: {{ $v.name }}
    spec:
      containers:
        - name: {{ $.Chart.Name }}
          image: "{{ $.Values.image.name }}:{{ $v.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $.Values.service.targetPort }}
          env: {{- toYaml $v.env | nindent 12 }}
          resources: {{- toYaml $.Values.resources | nindent 12 }}
          livenessProbe: {{- toYaml $.Values.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml $.Values.readinessProbe | nindent 12 }}
{{- end }}