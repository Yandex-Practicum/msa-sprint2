{{- if .Values.service.enabled }}
{{- $app := .Values.appName | default .Release.Name }}
# Один Service на все версии: выбирает поды по app, а версию выбирает Istio (DestinationRule subsets)
apiVersion: v1
kind: Service
metadata:
  name: {{ $app }}
  labels:
    app: {{ $app }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: {{ $app }}
{{- end }}
