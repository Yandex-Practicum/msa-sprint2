# VirtualService для feature flag и канареечного release
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: booking-service
spec:
  hosts:
  - booking-service
  http:
  # Если клиент шлёт X-Feature-Enabled: true, то
  # трафик идёт на новую версию v2 (100%).
  - name: booking-feature-flag
    match:
    - headers:
        x-feature-enabled:
          exact: "true"
    route:
    - destination:
        host: booking-service
        subset: v2
      weight: 100

  # ИНАЧЕ -> канареечный Release с распределением трафика: 90% -> v1, 10% -> v2.
  # Retries на стороне Envoy защищают от сбоев и задержек.
  - name: booking-service-canary
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: gateway-error,connect-failure,refused-stream,reset
      retryIgnorePreviousHosts: true
    route:
    - destination:
        host: booking-service
        subset: v1
      weight: 90
    - destination:
        host: booking-service
        subset: v2
      weight: 10
