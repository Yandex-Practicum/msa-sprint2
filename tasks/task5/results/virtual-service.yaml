# Отрендеренный `helm template` вывод шаблона
# tasks/task5/helm/booking-service/templates/virtualservice.yaml
#
# Canary: 90% трафика на subset v1, 10% на subset v2.

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: booking-service
spec:
  hosts:
    - booking-service.default.svc.cluster.local
  http:
    - name: primary-canary
      route:
        - destination:
            host: booking-service.default.svc.cluster.local
            subset: v1
            port:
              number: 8080
          weight: 90
        - destination:
            host: booking-service.default.svc.cluster.local
            subset: v2
            port:
              number: 8080
          weight: 10
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure,refused-stream
