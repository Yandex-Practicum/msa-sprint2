# Пример конфигурации для версии v2 (с фича-флагами)
# Использование: helm install booking-service helm/booking-service -f values-v2.yaml

versions:
  v1:
    enabled: true
    replicas: 1
    env:
      - name: APP_VERSION
        value: "v1"
      - name: FEATURE_FLAGS_ENABLED
        value: "false"

  v2:
    enabled: true
    replicas: 2
    env:
      - name: APP_VERSION
        value: "v2"
      - name: FEATURE_FLAGS_ENABLED
        value: "true"

image:
  name: booking-service
  tag: latest
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

livenessProbe:
  httpGet:
    path: /ping
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ping
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
