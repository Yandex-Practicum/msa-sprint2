apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: booking-service-feature-flag
spec:
  configPatches:
    - applyTo: HTTP_ROUTE
      match:
        context: SIDECAR_OUTBOUND
        routeConfiguration:
          vhost:
            name: "booking-service.default.svc.cluster.local:80"
            route:
              action: ANY
      patch:
        operation: INSERT_BEFORE
        value:
          match:
            prefix: "/"
            headers:
              - name: "x-feature-enabled"
                exact_match: "true"
          route:
            cluster: "outbound|80|v2|booking-service.default.svc.cluster.local"
            timeout: 5s
