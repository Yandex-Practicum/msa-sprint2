stages:
  - unit-test
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_NAME: booking-service
  IMAGE_TAG: latest

unit-test:
  stage: unit-test
  script:
    - cd booking-service
    - go test -v ./...

build:
  stage: build
  script:
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} booking-service/
    - docker images ${IMAGE_NAME}:${IMAGE_TAG}

test:
  stage: test
  script:
    - docker rm -f booking-service-test || true
    - docker run -d --name booking-service-test -p 8080:8080 -e ENABLE_FEATURE_X=true ${IMAGE_NAME}:${IMAGE_TAG}
    - sleep 2
    - test "$(curl -s http://localhost:8080/ping)" = "pong" && echo "OK  /ping -> pong"
    - curl --fail -s http://localhost:8080/ready | grep -q ready && echo "OK  /ready"
    - curl --fail -s http://localhost:8080/health | grep -q ok && echo "OK  /health"
    - test "$(curl -s http://localhost:8080/feature)" = "Feature X is enabled!" && echo "OK  /feature (ENABLE_FEATURE_X=true)"
    - docker rm -f booking-service-test

deploy:
  stage: deploy
  script:
    - minikube status >/dev/null 2>&1 || minikube start --driver=docker
    - minikube image load ${IMAGE_NAME}:${IMAGE_TAG}   # ← только для локального теста; в prod строка удаляется
    - helm upgrade --install booking-service helm/booking-service -f helm/booking-service/values-staging.yaml --set image.name=${IMAGE_NAME} --set image.tag=${IMAGE_TAG} --set image.pullPolicy=Never
    - kubectl rollout status deployment/booking-service --timeout=120s

tag:
  stage: tag
  script:
    - git tag "booking-service-$(date +%Y%m%d-%H%M%S)"
    - echo "Создан тег:"
    - git tag -l "booking-service-*" | sort | tail -3