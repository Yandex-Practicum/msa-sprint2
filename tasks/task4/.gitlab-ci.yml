stages:
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_TAG: latest
  IMAGE_NAME: booking-service
  RELEASE_NAME: booking-service
  HELM_CHART: helm/booking-service
  # Окружение деплоя: staging или prod — выбирает файл values-$DEPLOY_ENV.yaml
  DEPLOY_ENV: staging
  TEST_CONTAINER: booking-service-ci-test
  TEST_PORT: "18080"

build:
  stage: build
  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" booking-service
    - docker image inspect "$IMAGE_NAME:$IMAGE_TAG" --format 'Built {{.RepoTags}} {{.Id}}'

test:
  stage: test
  script:
    - docker rm -f "$TEST_CONTAINER" > /dev/null 2>&1 || true
    - docker run -d --name "$TEST_CONTAINER" -p "$TEST_PORT:8080" -e ENABLE_FEATURE_X=true "$IMAGE_NAME:$IMAGE_TAG"
    - |
      for attempt in $(seq 1 20); do
        curl -sf "http://localhost:$TEST_PORT/ping" > /dev/null && break
        sleep 1
      done
    - test "$(curl -sf http://localhost:$TEST_PORT/ping)" = "pong"
    - echo "✅ /ping -> pong"
    - test "$(curl -sf http://localhost:$TEST_PORT/feature)" = "Feature X is enabled!"
    - echo "✅ ENABLE_FEATURE_X=true -> /feature доступен"
    - docker rm -f "$TEST_CONTAINER" > /dev/null
  after_script:
    - docker rm -f "$TEST_CONTAINER" > /dev/null 2>&1 || true

deploy:
  stage: deploy
  script:
    - minikube image load "$IMAGE_NAME:$IMAGE_TAG" --overwrite=true
    # imagePullPolicy: Never и тег latest: без перезапуска поды продолжат работать со старым образом
    - helm upgrade --install "$RELEASE_NAME" "$HELM_CHART" -f "$HELM_CHART/values-$DEPLOY_ENV.yaml" --set image.tag="$IMAGE_TAG" --wait --timeout 120s
    - kubectl rollout restart "deployment/$RELEASE_NAME"
    - kubectl rollout status "deployment/$RELEASE_NAME" --timeout=120s
    - kubectl get pods -l "app=$RELEASE_NAME"

tag:
  stage: tag
  script:
    - TAG_NAME="$IMAGE_NAME-$(date +%Y%m%d-%H%M%S)"
    # Аннотированный тег с сообщением: работает и при включённой подписи тегов (tag.gpgsign)
    - git tag -a "$TAG_NAME" -m "CI build $IMAGE_NAME:$IMAGE_TAG deployed to $DEPLOY_ENV"
    - echo "✅ Создан git-тег $TAG_NAME (локально, без push)"
