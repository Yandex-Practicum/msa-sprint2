stages:
  - unit-test
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_TAG: latest
  IMAGE_NAME: booking-service
  RELEASE_NAME: booking-service

unit-test:
  stage: unit-test
  script:
    - cd ./booking-service && ./gradlew test

build:
  stage: build
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -f ./booking-service/Dockerfile .


test:
  stage: test
  script:
    - docker run -d --name test-container -p 8080:8080 $IMAGE_NAME:$IMAGE_TAG
    - sleep 10
    - curl -f http://localhost:8080/ping || (docker logs test-container && docker rm -f test-container && exit 1)
    - docker stop test-container
    - docker rm test-container


deploy:
  stage: deploy
  script:
    - minikube image load $IMAGE_NAME:$IMAGE_TAG
    - helm upgrade --install $RELEASE_NAME ./helm/booking-service
      -f ./helm/booking-service/values.yaml
      -f ./helm/booking-service/values-stage.yaml
      --set image.repository=$IMAGE_NAME
      --set image.tag=$IMAGE_TAG

tag:
  stage: tag
  script:
    - TIMESTAMP=$(date +%Y%m%d%H%M%S)
    - git tag "release-$TIMESTAMP"