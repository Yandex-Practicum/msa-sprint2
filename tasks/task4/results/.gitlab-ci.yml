stages:
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_TAG: latest
  IMAGE_NAME: booking-service
  VALUES_FILE: helm/booking-service/values-staging.yaml

build:
  stage: build
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG ./booking-service

test:
  stage: test
  script:
    - docker rm -f booking-test || true
    - docker run -d --name booking-test -p 18080:8080 $IMAGE_NAME:$IMAGE_TAG
    - sleep 3
    - curl --fail http://localhost:18080/ping
    - docker rm -f booking-test

deploy:
  stage: deploy
  script:
    - minikube image load $IMAGE_NAME:$IMAGE_TAG
    - helm upgrade --install booking-service ./helm/booking-service -f $VALUES_FILE
    - kubectl rollout restart deployment/booking-service
    - kubectl rollout status deployment/booking-service --timeout=120s

tag:
  stage: tag
  script:
    - TAG="release-$(date +%Y%m%d-%H%M%S)"
    - git tag "$TAG"
    - echo "Created tag $TAG"
